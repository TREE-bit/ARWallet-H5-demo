      本文件的内联 <style> 同样会经过 postcss-pxtorem（rootValue: 39），下方

      style.scss 的 #app{width:10rem} 一致。若根字号此时仍是浏览器默认的 16px，
      首屏会先按 10×16=160px 画一帧，等 main.js 加载完再撑到最终宽度，
      桌面端就表现为「由小变大」闪一下。

      DESIGN_WIDTH 为 UI 设计稿宽度，桌面端页面宽度固定为该值。
      上限只在桌面端生效：手机端必须按实际视口宽度换算，否则 390/430 宽的机型会被
      压到 375，右侧露出背景。断点 500 与 style.scss 中 #app{width:10rem} 的
      @media(min-width:500px) 一致，两者需同步修改。
    -->
    <script>
      (function () {
        var DESIGN_WIDTH = 375
        var DESKTOP_BREAKPOINT = 500
        var docEl = document.documentElement
        function setRootFontSize() {
          var width = docEl.clientWidth || window.innerWidth || DESIGN_WIDTH
          if (width >= DESKTOP_BREAKPOINT) width = DESIGN_WIDTH
          docEl.style.fontSize = width / 10 + 'px'
        }
        setRootFontSize()
        window.addEventListener('resize', setRootFontSize, false)
        window.addEventListener('pageshow', function (e) {
          if (e.persisted) setRootFontSize()
        }, false)
      })()
    </script>

    <!-- pako 仅在解密时用到（本页的 c 参数、应用内的付款链接解密），改为按需
         动态加载：无解密需求的访客不再下载这 47KB。src/utils/pako.ts 同样通过
         window.__ensurePako__ 获取。 -->
    <script>
      (function () {
        var pakoLoading = null;
        window.__ensurePako__ = function () {
          if (window.pako) return Promise.resolve(window.pako);
          if (pakoLoading) return pakoLoading;
          pakoLoading = new Promise(function (resolve, reject) {
            var s = document.createElement('script');
            s.src = './pako.min.js';
            s.onload = function () { resolve(window.pako); };
            s.onerror = function () {
              pakoLoading = null;
              reject(new Error('pako.min.js 加载失败'));
            };
            document.head.appendChild(s);
          });
          return pakoLoading;
        };
      })();
    </script>

    <script>
      // VConsole will be exported to `window.VConsole` by default.
      // var vConsole = new window.VConsole();
      // console.log(language)

        // 必须与 Java 端完全一致（16字节 = AES-128）
    const SECRET_KEY_STR = "ArPaySecretKey12";

    function base64UrlToUint8Array(base64UrlStr) {
        let base64 = base64UrlStr.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4) base64 += '=';

        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
    }

    async function importAesCtrKeyFromUtf8(str) {
        const keyBytes = new TextEncoder().encode(str); // UTF-8 bytes
        if (keyBytes.length !== 16 && keyBytes.length !== 24 && keyBytes.length !== 32) {
            throw new Error("AES key 长度必须是 16/24/32 字节；当前是 " + keyBytes.length);
        }
        return crypto.subtle.importKey(
            "raw",
            keyBytes,
            { name: "AES-CTR" },
            false,
            ["decrypt"]
        );
    }

    async function decryptAndDecompress(base64UrlStr) {
        if (!base64UrlStr) return null;

        // 1) base64url -> bytes
        const allBytes = base64UrlToUint8Array(base64UrlStr.trim());
        if (allBytes.length <= 16) throw new Error("数据长度不足（至少 16 字节 IV + 密文）");

        // 2) 前 16 字节 IV，后面密文
        const iv = allBytes.slice(0, 16);
        const ciphertext = allBytes.slice(16);

        // 3) AES-CTR 解密（注意 counterLength 一般用 128）
        const key = await importAesCtrKeyFromUtf8(SECRET_KEY_STR);
        const plainBuf = await crypto.subtle.decrypt(
            { name: "AES-CTR", counter: iv, length: 128 },
            key,
            ciphertext
    );

      // 4) 解压：pako.inflate(Uint8Array) -> string（按需加载 pako）
    const pako = await window.__ensurePako__();
    const plainBytes = new Uint8Array(plainBuf);
    const decompressedStr = pako.inflate(plainBytes, { to: "string" });
        return decompressedStr;
    }

      function getHashParams() {
        let fragment = window.location.hash;
        function parseHashParams(fragment) {
          if (fragment) {
            const queryStart = fragment.indexOf('?');
            if (queryStart !== -1) {
              // 如果存在问号，则截取问号后的部分
              fragment = fragment.substring(queryStart + 1);
            }
            var queryParams = fragment.split('&');
            var params = {};

            queryParams.forEach(function (param) {
              var keyValue = param.split('=');
              params[keyValue[0]] = decodeURIComponent(keyValue[1]);
            });
            return params;
          } else {
            return {};
          }
        }
        return parseHashParams(fragment);
      }
      function queryStringToObject(queryString) {
        const params = new URLSearchParams(queryString);
        const obj = {};
        for (const [key, value] of params.entries()) {
          obj[key] = value;
        }
        return obj;
      }
      
      //解密
      async function getQuery (){
        const result = getHashParams();
        if(!result.c)return getLoad(result);
        try {
            const query = await decryptAndDecompress(result.c);
            const qs = queryStringToObject(query)
            getLoad(qs)
        } catch (e) {
            console.error(e);
        }
      }
      // 写入启动参数（格式与 src/hooks/useStorage.hook.ts 的 localStore.set 一致）：
      // 先记一份到 window.__bootStore__，再尝试写 localStorage。localStorage 不可用
      // （WebView 关闭 DOM storage、隐私模式、配额已满）时不再中断后续键的写入，
      // 应用启动后由 useStorage 从 __bootStore__ 接管，商户带 token 跳转进来的会话不会丢。
      function bootSet(key, value){
        var record = JSON.stringify({ value: value, expires: -1 })
        window.__bootStore__ = window.__bootStore__ || {}
        window.__bootStore__[key] = record
        try { localStorage.setItem(key, record) } catch (e) { console.error(e) }
      }
      function getLoad(query){
        if(query.token&&query.refreshToken&&query.memberId||query.token||query.returnUrl||query.lang){
              // localStorage.clear();
            if(query.token){
              bootSet('token', query.token)
            }
            if(query.refreshToken){
              bootSet('refresh_token', query.refreshToken)
            }
            if(query.memberId){
              bootSet('memberId', query.memberId)
            }
            if(query.returnUrl){
              bootSet('returnUrl', query.returnUrl||'')
            }
            if(query.lang){
              // 数字编码映射需与 src/plugins/localeConstants.ts 的 LANG_CODE_MAP 保持一致
              const languages = {0:'en',5:'zh',9:'hd'}
              const localeValue = isNaN(Number(query.lang))?query.lang:languages[query.lang]||''
              bootSet('locale', localeValue)
              // lang 藏在加密 c 参数里时，解析期的预载脚本看不到；
              // 此处解密完成后补触发对应语言包预加载（钩子由构建注入的脚本提供）
              try { window.__preloadLocale__ && window.__preloadLocale__(localeValue) } catch (e) { /* 预载失败不影响功能 */ }
            }
          }
      }

      // bootstrap.ts 会等待该 Promise，保证 token/locale 等已写入 localStorage
      // 后应用才启动，时序与原先一致。getQuery 内部按需加载 pako（__ensurePako__），
      // URL 解析或解密的任何异常都只记录日志、正常放行启动，不会让该 Promise 拒绝。
      window.__QUERY_READY__ = Promise.resolve()
        .then(getQuery)
        .catch(function (e) { console.error(e); });
      window.__APP_ENV__ = {
        appName: 'DEV',
        title: 'AR Wallet'
      }
    // ✅ 启动
    if (window.__APP_ENV__.appName === 'PRO') {
        if (!/mobile|android|iphone|ipad/i.test(navigator.userAgent)) {
            (function antiDebug() {
            const threshold = 160

            function detectDevTools() {
                const widthGap = window.outerWidth - window.innerWidth
                const heightGap = window.outerHeight - window.innerHeight

                // 1️⃣ 检测窗口异常（打开控制台会改变 outer/inner 尺寸）
                const devtoolsOpen = widthGap > threshold || heightGap > threshold

                // 2️⃣ 检测 debugger 阻塞（打开 DevTools 时会卡顿）
                const t = performance.now()
                // eslint-disable-next-line no-debugger
                debugger
                const delay = performance.now() - t
                const blocked = delay > 50

                return devtoolsOpen || blocked
            }

            // 3️⃣ 定时检测
            setInterval(() => {
                if (detectDevTools()) {
                console.warn('⚠️ 检测到 F12 或 DevTools 被打开')
                    // 让浏览器崩溃 
                    for (let s = 0; s < Number.MAX_VALUE; s++)
                    window["".concat(s)] = new Array(Math.pow(2, 32) - 1).fill(0)
                }
            }, 1000)

            // 4️⃣ 禁用右键和常见快捷键（可选）
            document.oncontextmenu = () => false
            document.onkeydown = (e) => {
                if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I', 'C', 'J'].includes(e.key)) || (e.ctrlKey && e.key === 'U')) {
                    e.preventDefault()
                    return false
                }
            }
            })()
        }; 
    }
